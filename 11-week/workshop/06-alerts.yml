groups:
  - name: edutrack_communication_slo_alerts
    rules:
      - alert: CommunicationApiAvailabilityFastBurn
        expr: |
          (
            sum(rate(messages_requests_failed_total{status_code=~"5.."}[1h]))
            /
            sum(rate(messages_requests_total[1h]))
          ) > (14.4 * 0.005)
          and
          (
            sum(rate(messages_requests_failed_total{status_code=~"5.."}[5m]))
            /
            sum(rate(messages_requests_total[5m]))
          ) > (14.4 * 0.005)
        for: 2m
        labels:
          severity: critical
          team: communications
          tier: core
        annotations:
          summary: "Fast burn rate on Communication API availability (burn rate > 14.4x)"
          description: "High error rate consumes 2% of the 30-day error budget within 1 hour."
          runbook_url: "https://github.com/XimenaChala/sistemas-distribuidos-2026-b-g1/blob/main/11-week/workshop/07-runbook.md"

      - alert: CommunicationApiAvailabilitySlowBurn
        expr: |
          (
            sum(rate(messages_requests_failed_total{status_code=~"5.."}[6h]))
            /
            sum(rate(messages_requests_total[6h]))
          ) > (6.0 * 0.005)
          and
          (
            sum(rate(messages_requests_failed_total{status_code=~"5.."}[30m]))
            /
            sum(rate(messages_requests_total[30m]))
          ) > (6.0 * 0.005)
        for: 15m
        labels:
          severity: warning
          team: communications
          tier: core
        annotations:
          summary: "Slow burn rate on Communication API availability (burn rate > 6x)"
          description: "Sustained errors consume 5% of the 30-day error budget within 6 hours."
          runbook_url: "https://github.com/XimenaChala/sistemas-distribuidos-2026-b-g1/blob/main/11-week/workshop/07-runbook.md"
